openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HydraNMS multi-tenant network monitoring API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: NMS overview and operational summaries
  - name: devices
    description: SNMP-managed devices and discovery
  - name: vpn
    description: WireGuard site connectivity for customer networks
  - name: alerts
    description: Availability and threshold alerts
  - name: companies
    description: Tenant companies and onboarding
  - name: billing
    description: Plans, checkout, and portal licensing
  - name: support
    description: Support tickets and support PIN workflow
  - name: contact
    description: Public contact inquiries
  - name: auth
    description: HydraNMS own user management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: submitContactMessage
      tags: [contact]
      summary: Send a public contact message to the HydraNMS team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSubmissionInput"
      responses:
        "201":
          description: Contact message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmissionResponse"
        "400":
          description: Invalid contact message
        "429":
          description: Contact rate limit exceeded
  /admin/contact-submissions:
    get:
      operationId: getContactSubmissions
      tags: [contact]
      summary: List contact inquiries for super-admin review
      responses:
        "200":
          description: Contact inquiries ordered from newest to oldest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmissions"
        "401":
          description: Authentication required
        "403":
          description: Super-admin access required
  /admin/contact-submissions/cleanup:
    post:
      operationId: purgeContactSubmissions
      tags: [contact]
      summary: Purge contact inquiries past the retention period
      description: Deletes contact inquiries older than the 180-day retention period. Inquiries at or newer than the cutoff are retained.
      responses:
        "200":
          description: Retention cleanup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmissionCleanup"
        "401":
          description: Authentication required
        "403":
          description: Super-admin access required
        "400":
          description: Cleanup failed
  /admin/contact-submissions/{submissionId}:
    patch:
      operationId: updateContactSubmission
      tags: [contact]
      summary: Update contact inquiry review state
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSubmissionUpdate"
      responses:
        "200":
          description: Updated contact inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmission"
        "400":
          description: Invalid review state
        "401":
          description: Authentication required
        "403":
          description: Super-admin access required
        "404":
          description: Contact inquiry not found
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get tenant operations summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Get super-admin platform summary
      responses:
        "200":
          description: Super-admin aggregate dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /devices:
    get:
      operationId: getDevices
      tags: [devices]
      summary: List monitored devices
      responses:
        "200":
          description: Device inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
    post:
      operationId: createDevice
      tags: [devices]
      summary: Add a device for SNMP polling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInput"
      responses:
        "201":
          description: Device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
  /vpn/sites:
    get:
      operationId: getVpnSites
      tags: [vpn]
      summary: List WireGuard sites visible to the active company
      responses:
        "200":
          description: WireGuard site inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VpnSite"
    post:
      operationId: createVpnSite
      tags: [vpn]
      summary: Create a WireGuard site for a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VpnSiteInput"
      responses:
        "201":
          description: WireGuard site created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnSite"
        "400":
          description: Invalid or overlapping network
        "403":
          description: Super-admin access required
  /vpn/sites/{siteId}/bundle:
    post:
      operationId: generateVpnSiteBundle
      tags: [vpn]
      summary: Generate a one-time WireGuard and RouterOS onboarding bundle
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: WireGuard configuration bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnSiteBundle"
        "404":
          description: Site not found in the active company
        "409":
          description: WireGuard server settings are not configured
  /vpn/sites/{siteId}/revoke:
    post:
      operationId: revokeVpnSite
      tags: [vpn]
      summary: Revoke a WireGuard site peer
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Site peer revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnSite"
        "403":
          description: Super-admin access required
        "404":
          description: Site not found in the active company
  /devices/{deviceId}:
    delete:
      operationId: deleteDevice
      tags: [devices]
      summary: Permanently delete a monitored device and its telemetry
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Device deleted
        "404":
          description: Device not found in the active company
  /devices/{deviceId}/olt-login:
    post:
      operationId: createDeviceOltLogin
      tags: [devices]
      summary: Create a short-lived isolated management session for a WireGuard device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceOltLoginInput"
      responses:
        "200":
          description: Single-use browser handoff grant and isolated proxy URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOltLogin"
        "400":
          description: Invalid protocol or company selection
        "403":
          description: Portal origin or authentication is not allowed
        "404":
          description: Device not found in the active company
        "409":
          description: Device is not attached to an active WireGuard route
        "503":
          description: Isolated OLT proxy is unavailable
  /devices/{deviceId}/details:
    get:
      operationId: getDeviceDetails
      tags: [devices]
      summary: Get interface and ONU telemetry for a monitored device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Device detail telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDetails"
        "404":
          description: Device not found in the active company
  /devices/{deviceId}/mib-settings:
    patch:
      operationId: updateDeviceMibSettings
      tags: [devices]
      summary: Update a device MIB profile and OID overrides
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceMibSettingsInput"
      responses:
        "200":
          description: Updated device configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Device not found in the active company
  /devices/{deviceId}/web-login-settings:
    patch:
      operationId: updateDeviceWebLoginSettings
      tags: [devices]
      summary: Configure the web protocol and port for a monitored OLT
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceWebLoginSettingsInput"
      responses:
        "200":
          description: Updated OLT web-login configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: Invalid protocol or unsupported web port
        "404":
          description: Device not found in the active company
  /devices/{deviceId}/olt-web-login/session:
    post:
      operationId: createOltWebLoginSession
      tags: [devices]
      summary: Create a short-lived, tenant-scoped OLT proxy session
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Isolated OLT proxy origin and one-time bootstrap ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OltWebLoginSession"
        "404":
          description: OLT not found in the active company
        "409":
          description: OLT settings, VPN route, or proxy hostname is not ready
  /devices/{deviceId}/cli-settings:
    patch:
      operationId: updateDeviceCliSettings
      tags: [devices]
      summary: Configure SSH and Telnet access for a device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCliSettingsInput"
      responses:
        "200":
          description: Updated device CLI configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Device not found in the active company
  /devices/{deviceId}/cli/execute:
    post:
      operationId: executeDeviceCliCommand
      tags: [devices]
      summary: Execute one command on a device CLI
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCliCommandInput"
      responses:
        "200":
          description: CLI command output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCliCommandResponse"
        "404":
          description: Device not found in the active company
  /devices/{deviceId}/cli/status:
    get:
      operationId: getDeviceCliStatus
      tags: [devices]
      summary: Check SSH and Telnet reachability for a device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: SSH and Telnet connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCliStatusResponse"
        "404":
          description: Device not found in the active company
  /devices/history:
    get:
      operationId: getDeviceHistory
      tags: [devices]
      summary: Get recent interface and ONU telemetry history
      parameters:
        - name: deviceId
          in: query
          required: true
          schema: { type: string }
        - name: window
          in: query
          required: false
          description: Recent history window to return
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d]
            default: 24h
      responses:
        "200":
          description: Device telemetry history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceHistory"
        "404":
          description: Device not found in the active company
  /devices/discover:
    post:
      operationId: discoverDevices
      tags: [devices]
      summary: Discover devices on a network range
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryInput"
      responses:
        "202":
          description: Discovery job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryJob"
  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: List recent alerts
      responses:
        "200":
          description: Recent alert events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
  /settings/alerts:
    get:
      operationId: getAlertSettings
      tags: [alerts]
      summary: Read company alert channel settings
      responses:
        "200":
          description: Alert channel settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
    patch:
      operationId: updateAlertSettings
      tags: [alerts]
      summary: Update company alert channel settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertSettingsInput"
      responses:
        "200":
          description: Updated alert channel settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
  /settings/alerts/telegram/test:
    post:
      operationId: testTelegramAlert
      tags: [alerts]
      summary: Verify the configured Telegram bot and recipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramTestInput"
      responses:
        "200":
          description: Telegram test message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramTestResponse"
  /companies:
    get:
      operationId: getCompanies
      tags: [companies]
      summary: List companies for super-admin
      responses:
        "200":
          description: Company tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Register a company tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Company registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /companies/{companyId}:
    patch:
      operationId: updateCompany
      tags: [companies]
      summary: Update a company tenant profile
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "200":
          description: Updated company tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    delete:
      operationId: deleteCompany
      tags: [companies]
      summary: Permanently delete a company tenant
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Company tenant deleted
  /company/profile:
    get:
      operationId: getCompanyProfile
      tags: [companies]
      summary: Get the signed-in tenant company profile
      responses:
        "200":
          description: Current tenant company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    patch:
      operationId: updateCompanyProfile
      tags: [companies]
      summary: Update the signed-in tenant company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyProfileInput"
      responses:
        "200":
          description: Updated tenant company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /company/profile/ping:
    post:
      operationId: checkCompanyProfilePing
      tags: [companies]
      summary: Check reachability for an IP address from the tenant workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyProfilePingInput"
      responses:
        "200":
          description: Ping result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfilePingResponse"
  /admin/company-profile:
    get:
      operationId: getAdminCompanyProfile
      tags: [billing]
      summary: Get the super-admin company billing profile
      responses:
        "200":
          description: Super-admin company details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanyProfile"
    patch:
      operationId: updateAdminCompanyProfile
      tags: [billing]
      summary: Update the super-admin company billing profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformCompanyProfileInput"
      responses:
        "200":
          description: Updated super-admin company details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanyProfile"
  /storage/uploads/request-url:
    post:
      operationId: requestStorageUploadUrl
      tags: [billing]
      summary: Request a protected object-storage upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUploadInput"
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUploadResponse"
  /company/users:
    get:
      operationId: getCompanyUsers
      tags: [companies]
      summary: List users in the signed-in tenant company
      responses:
        "200":
          description: Company users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyUser"
    post:
      operationId: createCompanyUser
      tags: [companies]
      summary: Add a user to the signed-in tenant company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyUserInput"
      responses:
        "201":
          description: Company user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyUser"
  /company/users/{userId}:
    patch:
      operationId: updateCompanyUser
      tags: [companies]
      summary: Update a user in the signed-in tenant company
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyUserInput"
      responses:
        "200":
          description: Company user updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyUser"
  /company/audit-log:
    get:
      operationId: getCompanyAuditLog
      tags: [auth]
      summary: List user and company activity for the signed-in tenant
      responses:
        "200":
          description: Tenant audit log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
  /companies/poller-log:
    get:
      operationId: getCompanyPollerLog
      tags: [companies, devices]
      summary: List recent poller activity for a company
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Recent company poller activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PollerLog"
        "403":
          description: Super-admin access required
  /companies/{companyId}/license:
    patch:
      operationId: updateCompanyLicense
      tags: [companies, billing]
      summary: Update a tenant license as a super-admin
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseUpdateInput"
      responses:
        "200":
          description: Updated license
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/License"
  /plans:
    get:
      operationId: getPlans
      tags: [billing]
      summary: List subscription plans
      responses:
        "200":
          description: Available plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [billing]
      summary: Create a subscription plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Created subscription plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
  /plans/{planId}:
    patch:
      operationId: updatePlan
      tags: [billing]
      summary: Update a subscription plan
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "200":
          description: Updated subscription plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
  /billing/checkout:
    post:
      operationId: createCheckout
      tags: [billing]
      summary: Create an AblePay checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
  /billing/webhooks/ablepay:
    post:
      operationId: receiveAblePayWebhook
      tags: [billing]
      summary: Receive a signed AblePay payment event
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReceipt"
  /billing/license:
    get:
      operationId: getLicense
      tags: [billing]
      summary: Get the active portal license
      responses:
        "200":
          description: Active license
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/License"
  /billing/payments:
    get:
      operationId: getPaymentRecords
      tags: [billing]
      summary: Get tenant payment and invoice history
      responses:
        "200":
          description: Tenant-scoped payment and invoice history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecordList"
  /admin/notifications:
    get:
      operationId: getNotificationDeliveries
      tags: [billing]
      summary: Search notification delivery history
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: status
          in: query
          schema: { type: string, enum: [queued, sending, sent, failed] }
        - name: channel
          in: query
          schema: { type: string, enum: [email, telegram, ticket_telegram] }
        - name: eventType
          in: query
          schema: { type: string }
        - name: recipient
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Bounded, paginated notification delivery history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeliveryHistory"
  /admin/notifications/{id}:
    get:
      operationId: getNotificationDelivery
      tags: [billing]
      summary: Inspect one notification delivery attempt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Notification delivery attempt details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDelivery"
        "404":
          description: Delivery not found
  /admin/notifications/{id}/retry:
    post:
      operationId: retryNotification
      tags: [billing]
      summary: Retry a failed notification delivery
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Retry result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryNotification"
        "409":
          description: Delivery has exhausted its retry budget
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /admin/billing/webhook-events:
    get:
      operationId: getPaymentWebhookEvents
      tags: [billing]
      summary: List payment webhook processing events
      responses:
        "200":
          description: Payment webhook events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentWebhookEvent"
  /admin/billing/payments:
    get:
      operationId: getAdminPaymentRecords
      tags: [billing]
      summary: List payment and invoice records for every company
      parameters:
        - name: page
          in: query
          description: One-based page number, ordered from newest checkout to oldest
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          description: Number of checkout records per page
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: companyId
          in: query
          description: Restrict records to one company
          schema: { type: string }
        - name: status
          in: query
          description: Restrict records to one checkout payment status
          schema: { type: string, enum: [pending, paid, failed] }
      responses:
        "200":
          description: Bounded page of all-company payment and invoice records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaymentRecordList"
  /support/tickets:
    get:
      operationId: getSupportTickets
      tags: [support]
      summary: List support tickets
      responses:
        "200":
          description: Support tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicket"
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Create a support ticket with a support PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketInput"
      responses:
        "201":
          description: Support ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
  /tickets:
    get:
      operationId: getIncidentTickets
      tags: [support]
      summary: List company incident tickets
      responses:
        "200":
          description: Incident tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentTicket"
    post:
      operationId: createIncidentTicket
      tags: [support]
      summary: Create a manual incident ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentTicketInput"
      responses:
        "201":
          description: Incident ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentTicket"
  /tickets/{ticketId}/resolve:
    patch:
      operationId: resolveIncidentTicket
      tags: [support]
      summary: Resolve a company incident ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Incident ticket resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentTicket"
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a portal owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered user and company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResult"
  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Log in with email or username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Log out the current session
      responses:
        "204":
          description: Current session revoked and cookie cleared
  /auth/profile:
    get:
      operationId: getUserProfile
      tags: [auth]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: Signed-in user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateUserProfile
      tags: [auth]
      summary: Update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /auth/profile/password:
    patch:
      operationId: changeUserPassword
      tags: [auth]
      summary: Change the signed-in user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed and a fresh session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
  /auth/sessions/revoke:
    post:
      operationId: revokeUserSessions
      tags: [auth]
      summary: Revoke all sessions for the current user
      responses:
        "204":
          description: All sessions revoked and cookie cleared
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required: [companyName, subdomain, uptime, totalDevices, onlineDevices, openAlerts, deviceBreakdown, uptimeSeries]
      properties:
        companyName: { type: string }
        subdomain: { type: string }
        uptime: { type: number }
        totalDevices: { type: integer }
        onlineDevices: { type: integer }
        openAlerts: { type: integer }
        deviceBreakdown:
          type: array
          items: { $ref: "#/components/schemas/DeviceBreakdown" }
        uptimeSeries:
          type: array
          items: { $ref: "#/components/schemas/UptimePoint" }
    AdminDashboard:
      type: object
      required: [totalCompanies, totalBilling, totalDevices, pendingSupportTickets, pendingContactInquiries]
      properties:
        totalCompanies: { type: integer }
        totalBilling: { type: number }
        totalDevices: { type: integer }
        pendingSupportTickets: { type: integer }
        pendingContactInquiries: { type: integer }
    DeviceBreakdown:
      type: object
      required: [label, count, color]
      properties:
        label: { type: string }
        count: { type: integer }
        color: { type: string }
    UptimePoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    VpnSite:
      type: object
      required: [id, companyId, name, lanCidr, tunnelAddress, routerOsVersion, status, routeState, lastHandshakeAt, lastBundleAt, revokedAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        companyId: { type: string }
        name: { type: string }
        lanCidr: { type: string }
        tunnelAddress: { type: string }
        routerOsVersion: { type: string }
        status: { type: string, enum: [pending, active, offline, revoked] }
        routeState: { type: string, enum: [pending, applied, error] }
        lastHandshakeAt: { type: ["string", "null"], format: date-time }
        lastBundleAt: { type: ["string", "null"], format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VpnSiteInput:
      type: object
      required: [companyId, name, lanCidr, routerOsVersion]
      properties:
        companyId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        lanCidr: { type: string, pattern: "^[0-9.]+/[0-9]+$" }
        routerOsVersion: { type: string, minLength: 1, maxLength: 40 }
    VpnSiteBundle:
      type: object
      required: [siteId, name, tunnelAddress, lanCidr, serverEndpoint, serverPublicKey, clientPrivateKey, clientPublicKey, wireguardConfig, routerOsScript, serverPeerSnippet, generatedAt]
      properties:
        siteId: { type: string }
        name: { type: string }
        tunnelAddress: { type: string }
        lanCidr: { type: string }
        serverEndpoint: { type: string }
        serverPublicKey: { type: string }
        clientPrivateKey: { type: string }
        clientPublicKey: { type: string }
        wireguardConfig: { type: string }
        routerOsScript: { type: string }
        serverPeerSnippet: { type: string }
        generatedAt: { type: string, format: date-time }
    Device:
      type: object
      required: [id, companyId, vpnSiteId, name, ipAddress, vendor, type, status, uptime, lastSeen, location, mibProfile, ponCountOid, onuCountOid, rxPowerRoot, txPowerRoot, ponCount, onuCount, rxPower, txPower, sysUpTimeSeconds, systemVersion, ramPercent, diskPercent, interfaceCount, lastPollAt, cliConfigured, cliProtocol, sshPort, telnetPort, cliUsername, webLoginProtocol, webLoginPort]
      properties:
        id: { type: string }
        companyId: { type: string }
        vpnSiteId: { type: ["string", "null"] }
        name: { type: string }
        ipAddress: { type: string }
        vendor: { type: string }
        type: { type: string }
        status: { type: string, enum: [online, warning, offline, discovering] }
        uptime: { type: number }
        lastSeen: { type: string }
        location: { type: string }
        mibProfile: { type: ["string", "null"] }
        ponCountOid: { type: ["string", "null"] }
        onuCountOid: { type: ["string", "null"] }
        rxPowerRoot: { type: ["string", "null"] }
        txPowerRoot: { type: ["string", "null"] }
        ponCount: { type: ["integer", "null"] }
        onuCount: { type: ["integer", "null"] }
        rxPower: { type: ["number", "null"] }
        txPower: { type: ["number", "null"] }
        sysUpTimeSeconds: { type: ["number", "null"] }
        systemVersion: { type: ["string", "null"] }
        ramPercent: { type: ["number", "null"] }
        diskPercent: { type: ["number", "null"] }
        interfaceCount: { type: integer }
        lastPollAt: { type: ["string", "null"], format: date-time }
        cliConfigured: { type: boolean }
        cliProtocol: { type: ["string", "null"], enum: [ssh, telnet, both, null] }
        sshPort: { type: ["integer", "null"] }
        telnetPort: { type: ["integer", "null"] }
        cliUsername: { type: ["string", "null"] }
        webLoginProtocol: { type: ["string", "null"], enum: [http, https, null] }
        webLoginPort: { type: ["integer", "null"] }
    OltWebLoginSession:
      type: object
      required: [proxyOrigin, ticket, ticketExpiresAt]
      properties:
        proxyOrigin: { type: string, format: uri }
        ticket: { type: string, description: Short-lived one-time token; never log or persist it }
        ticketExpiresAt: { type: string, format: date-time }
    DeviceInterface:
      type: object
      required: [id, deviceId, ifIndex, name, alias, adminStatus, operStatus, speedMbps, rxBytes, txBytes, sfpVendor, sfpSerialNumber, opticalRxPower, opticalTxPower, updatedAt, seriesKey]
      properties:
        id: { type: string }
        deviceId: { type: string }
        ifIndex: { type: integer }
        seriesKey:
          type: string
          description: Stable interface identity for selecting a history series
        name: { type: string }
        alias: { type: ["string", "null"] }
        adminStatus: { type: ["string", "null"] }
        operStatus: { type: ["string", "null"] }
        speedMbps: { type: ["number", "null"] }
        rxBytes: { type: ["string", "null"] }
        txBytes: { type: ["string", "null"] }
        sfpVendor: { type: ["string", "null"] }
        sfpSerialNumber: { type: ["string", "null"] }
        opticalRxPower: { type: ["number", "null"], description: Optical receive power in dBm }
        opticalTxPower: { type: ["number", "null"], description: Optical transmit power in dBm }
        updatedAt: { type: string, format: date-time }
    PonTelemetry:
      type: object
      required: [id, deviceId, ponIndex, onuIndex, rxPower, txPower, updatedAt, seriesKey]
      properties:
        id: { type: string }
        deviceId: { type: string }
        ponIndex: { type: integer }
        onuIndex: { type: integer }
        seriesKey:
          type: string
          description: Stable ONU identity for selecting a history series
        rxPower: { type: ["number", "null"] }
        txPower: { type: ["number", "null"] }
        updatedAt: { type: string, format: date-time }
    DeviceInterfaceSample:
      type: object
      required: [id, deviceId, ifIndex, name, rxBytes, txBytes, sampledAt, seriesKey]
      properties:
        id: { type: string }
        deviceId: { type: string }
        ifIndex: { type: integer }
        seriesKey:
          type: string
          description: Stable interface identity for selecting a history series
        name: { type: string }
        rxBytes: { type: ["string", "null"] }
        txBytes: { type: ["string", "null"] }
        sampledAt: { type: string, format: date-time }
    PonTelemetrySample:
      type: object
      required: [id, deviceId, ponIndex, onuIndex, rxPower, txPower, sampledAt, seriesKey]
      properties:
        id: { type: string }
        deviceId: { type: string }
        ponIndex: { type: integer }
        onuIndex: { type: integer }
        seriesKey:
          type: string
          description: Stable ONU identity for selecting a history series
        rxPower: { type: ["number", "null"] }
        txPower: { type: ["number", "null"] }
        sampledAt: { type: string, format: date-time }
    DeviceDetails:
      type: object
      required: [device, interfaces, ponTelemetry]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        interfaces:
          type: array
          items:
            $ref: "#/components/schemas/DeviceInterface"
        ponTelemetry:
          type: array
          items:
            $ref: "#/components/schemas/PonTelemetry"
    DeviceHistory:
      type: object
      required: [interfaceHistory, opticalHistory, historyWindow]
      properties:
        interfaceHistory:
          type: array
          items:
            $ref: "#/components/schemas/DeviceInterfaceSample"
        opticalHistory:
          type: array
          items:
            $ref: "#/components/schemas/PonTelemetrySample"
        historyWindow:
          type: string
          enum: [1h, 6h, 24h, 7d]
    DeviceInput:
      type: object
      required: [name, ipAddress, vendor, type, location]
      properties:
        vpnSiteId: { type: ["string", "null"] }
        name: { type: string, minLength: 1 }
        ipAddress: { type: string, minLength: 1 }
        vendor: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        location: { type: string, minLength: 1 }
        snmpVersion: { type: string, enum: [v1, v2c, v3] }
        snmpCommunity: { type: ["string", "null"] }
        snmpCredentialLabel: { type: string, minLength: 1 }
        snmpUsername: { type: ["string", "null"] }
        snmpAuthProtocol: { type: string, enum: [md5, sha, sha224, sha256, sha384, sha512] }
        snmpAuthPassword: { type: ["string", "null"] }
        snmpPrivProtocol: { type: string, enum: [des, aes, aes256b, aes256r] }
        snmpPrivPassword: { type: ["string", "null"] }
        snmpSecurityLevel: { type: string, enum: [noAuthNoPriv, authNoPriv, authPriv] }
        mibProfile: { type: ["string", "null"] }
        ponCountOid: { type: ["string", "null"] }
        onuCountOid: { type: ["string", "null"] }
        rxPowerRoot: { type: ["string", "null"] }
        txPowerRoot: { type: ["string", "null"] }
    DeviceMibSettingsInput:
      type: object
      required: [mibProfile, ponCountOid, onuCountOid, rxPowerRoot, txPowerRoot]
      properties:
        mibProfile: { type: ["string", "null"] }
        ponCountOid: { type: ["string", "null"] }
        onuCountOid: { type: ["string", "null"] }
        rxPowerRoot: { type: ["string", "null"] }
        txPowerRoot: { type: ["string", "null"] }
    DeviceWebLoginSettingsInput:
      type: object
      required: [webLoginProtocol, webLoginPort]
      properties:
        webLoginProtocol: { type: ["string", "null"], enum: [http, https, null] }
        webLoginPort: { type: ["integer", "null"] }
    DeviceCliSettingsInput:
      type: object
      required: [cliProtocol, sshPort, telnetPort, cliUsername, cliPassword]
      properties:
        cliProtocol: { type: string, enum: [ssh, telnet, both] }
        sshPort: { type: integer, minimum: 1, maximum: 65535 }
        telnetPort: { type: integer, minimum: 1, maximum: 65535 }
        cliUsername: { type: string, minLength: 1 }
        cliPassword: { type: string, minLength: 1 }
    DeviceOltLoginInput:
      type: object
      required: [protocol]
      properties:
        protocol: { type: string, enum: [http, https] }
    DeviceOltLogin:
      type: object
      required: [grant, iframeUrl]
      properties:
        grant: { type: string }
        iframeUrl: { type: string, format: uri }
    DeviceCliCommandInput:
      type: object
      required: [protocol, command]
      properties:
        protocol: { type: string, enum: [ssh, telnet] }
        command: { type: string, minLength: 1, maxLength: 2000 }
    DeviceCliCommandResponse:
      type: object
      required: [protocol, command, output, durationMs]
      properties:
        protocol: { type: string, enum: [ssh, telnet] }
        command: { type: string }
        output: { type: string }
        durationMs: { type: integer }
    DeviceCliStatus:
      type: object
      required: [state, latencyMs]
      properties:
        state: { type: string, enum: [reachable, unreachable, not_configured] }
        latencyMs: { type: ["integer", "null"] }
    DeviceCliStatusResponse:
      type: object
      required: [ssh, telnet]
      properties:
        ssh: { $ref: "#/components/schemas/DeviceCliStatus" }
        telnet: { $ref: "#/components/schemas/DeviceCliStatus" }
    DiscoveryInput:
      type: object
      required: [network, snmpVersion, credentialLabel]
      properties:
        network: { type: string, minLength: 1 }
        snmpVersion: { type: string, enum: [v1, v2c, v3] }
        credentialLabel: { type: string, minLength: 1 }
    DiscoveryJob:
      type: object
      required: [id, status, network, discoveredCount]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, completed] }
        network: { type: string }
        discoveredCount: { type: integer }
    Alert:
      type: object
      required: [id, severity, eventType, title, deviceName, message, time, acknowledged]
      properties:
        id: { type: string }
        severity: { type: string, enum: [critical, warning, info] }
        eventType:
          type: string
          enum: [device.down, device.recovered, threshold.breached, port.up, port.down, sfp.removed, sfp.rx.changed, sfp.tx.changed]
        title: { type: string }
        deviceName: { type: string }
        message: { type: string }
        time: { type: string }
        acknowledged: { type: boolean }
    Company:
      type: object
      required: [id, name, subdomain, email, status, devices, plan, renewalDate, licenseNumber, licenseStatus, licenseValidity]
      properties:
        id: { type: string }
        name: { type: string }
        subdomain: { type: string }
        email: { type: string }
        contactNumber: { type: string }
        gstNumber: { type: ["string", "null"] }
        address: { type: string }
        status: { type: string, enum: [active, pending, suspended] }
        devices: { type: integer }
        plan: { type: string }
        renewalDate: { type: string }
        licenseNumber: { type: string }
        licenseStatus: { type: string, enum: [active, expiring, expired] }
        licenseValidity: { type: string }
    CompanyInput:
      type: object
      required: [name, subdomain, email, contactNumber, address]
      properties:
        name: { type: string, minLength: 1 }
        subdomain: { type: string, minLength: 3 }
        email: { type: string, format: email }
        contactNumber: { type: string, minLength: 6 }
        gstNumber: { type: ["string", "null"] }
        address: { type: string, minLength: 1 }
    CompanyProfileInput:
      type: object
      required: [name, email, contactNumber, address]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        contactNumber: { type: string, minLength: 6 }
        gstNumber: { type: ["string", "null"] }
        address: { type: string, minLength: 1 }
    CompanyProfilePingInput:
      type: object
      required: [ip]
      properties:
        ip: { type: string, minLength: 7, maxLength: 15 }
    CompanyProfilePingResponse:
      type: object
      required: [ip, state, latencyMs, packetsSent, packetsReceived, packetLossPercent, checkedAt, message]
      properties:
        ip: { type: string }
        state: { type: string, enum: [reachable, unreachable, unavailable] }
        latencyMs: { type: ["number", "null"] }
        packetsSent: { type: integer }
        packetsReceived: { type: integer }
        packetLossPercent: { type: number }
        checkedAt: { type: string, format: date-time }
        message: { type: string }
    AuditLog:
      type: object
      required: [id, companyId, actorUserId, actorName, actorUsername, action, targetType, targetId, metadata, createdAt]
      properties:
        id: { type: string }
        companyId: { type: ["string", "null"] }
        actorUserId: { type: ["string", "null"] }
        actorName: { type: ["string", "null"] }
        actorUsername: { type: ["string", "null"] }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: ["string", "null"] }
        metadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    PollerLog:
      type: object
      required: [id, companyId, deviceId, deviceName, ipAddress, status, durationMs, error, createdAt]
      properties:
        id: { type: string }
        companyId: { type: string }
        deviceId: { type: string }
        deviceName: { type: string }
        ipAddress: { type: string }
        status: { type: string, enum: [success, failed] }
        durationMs: { type: ["integer", "null"] }
        error: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    PlatformCompanyProfile:
      type: object
      required: [companyName, address, gstNumber, phoneNumber, email, logoPath]
      properties:
        companyName: { type: string }
        address: { type: string }
        gstNumber: { type: ["string", "null"] }
        phoneNumber: { type: string }
        email: { type: string }
        logoPath: { type: ["string", "null"] }
    PlatformCompanyProfileInput:
      type: object
      required: [companyName, address, phoneNumber, email]
      properties:
        companyName: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        gstNumber: { type: ["string", "null"] }
        phoneNumber: { type: string, minLength: 6 }
        email: { type: string, format: email }
        logoPath: { type: ["string", "null"] }
    StorageUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
        purpose:
          type: string
          enum: [company_logo, profile]
          default: company_logo
    StorageUploadResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    Plan:
      type: object
      required: [id, name, price, interval, deviceLimit, features, popular]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
        interval: { type: string, enum: [monthly, yearly] }
        deviceLimit: { type: integer }
        features:
          type: array
          items: { type: string }
        popular: { type: boolean }
    PlanInput:
      type: object
      required: [id, name, price, interval, deviceLimit, features, popular]
      properties:
        id: { type: string, minLength: 1 }
